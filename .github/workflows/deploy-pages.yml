name: Publish AI CV Readiness

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download verified site bundle
        run: |
          curl --location --fail --retry 3 "https://filebin.net/001669e0c5f64bb585111dbf25afd0b5/shape-safe-site.zip" --output site.zip
          echo "7a5d3121607f2c9340ebd291314977fc9dd4d1e904b7ac5186b42c9a55b6d11c  site.zip" | sha256sum --check
          mkdir "${RUNNER_TEMP}/site"
          unzip -q site.zip -d "${RUNNER_TEMP}/site"
          test -f "${RUNNER_TEMP}/site/index.html"

      - name: Publish static branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf .
          cp -R "${RUNNER_TEMP}/site/." .
          touch .nojekyll
          git add --all
          git commit -m "Publish AI CV readiness site"
          git push --force origin gh-pages
