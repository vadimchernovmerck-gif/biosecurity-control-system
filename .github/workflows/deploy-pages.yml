name: Publish AI CV Readiness

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download verified site bundle
        run: |
          curl --location --fail --retry 3 "https://filebin.net/1702fca5d11a43888880ead2b84d84b3/normalized-sections-site.zip" --output site.zip
          echo "ea13e88c785444bf1c6924bd6edb16c0f1d1ccc633c2f08d9e056eef0887cd25  site.zip" | sha256sum --check
          mkdir "${RUNNER_TEMP}/site"
          unzip -q site.zip -d "${RUNNER_TEMP}/site"
          test -f "${RUNNER_TEMP}/site/index.html"

      - name: Publish static branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf .
          cp -R "${RUNNER_TEMP}/site/." .
          touch .nojekyll
          git add --all
          git commit -m "Publish AI CV readiness site"
          git push --force origin gh-pages
