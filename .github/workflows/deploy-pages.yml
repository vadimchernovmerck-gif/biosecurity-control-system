name: Publish AI CV Readiness

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download verified site bundle
        run: |
          curl --location --fail --retry 3 "https://filebin.net/7ffe12c444d84e66a60cf488e3ce4334/html-preview-site.zip" --output site.zip
          echo "c3e9a7133e61895aa0468e18de421d5c2e979d9bff19b8107524b18b3f5819d1  site.zip" | sha256sum --check
          mkdir "${RUNNER_TEMP}/site"
          unzip -q site.zip -d "${RUNNER_TEMP}/site"
          test -f "${RUNNER_TEMP}/site/index.html"

      - name: Publish static branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf .
          cp -R "${RUNNER_TEMP}/site/." .
          touch .nojekyll
          git add --all
          git commit -m "Publish AI CV readiness site"
          git push --force origin gh-pages
