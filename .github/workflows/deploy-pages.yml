name: Publish AI CV Readiness

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download verified site bundle
        run: |
          curl --location --fail --retry 3 "https://filebin.net/a1c06a4ae4574acb92426c394f3a19ae/json-fallback-site.zip" --output site.zip
          echo "f9692fc56fb099f8649893b50e11a8a05bd15ed8fe927231827668ccdbf8d0a3  site.zip" | sha256sum --check
          mkdir "${RUNNER_TEMP}/site"
          unzip -q site.zip -d "${RUNNER_TEMP}/site"
          test -f "${RUNNER_TEMP}/site/index.html"

      - name: Publish static branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf .
          cp -R "${RUNNER_TEMP}/site/." .
          touch .nojekyll
          git add --all
          git commit -m "Publish AI CV readiness site"
          git push --force origin gh-pages
